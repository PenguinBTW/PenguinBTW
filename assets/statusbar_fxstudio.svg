<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 22" width="100%" height="22">
  <defs>
    <style>
      .win-font { font-family: 'Segoe UI', Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif; font-size: 11px; fill: #000000; }
    </style>
  </defs>

  <rect x="0" y="0" width="850" height="22" fill="#c0c0c0"/>
  <line x1="0" y1="0" x2="850" y2="0" stroke="#808080" stroke-width="1"/>
  <line x1="0" y1="1" x2="850" y2="1" stroke="#ffffff" stroke-width="1"/>

  <!-- Panel 1: Deterministic state -->
  <g transform="translate(4, 3)">
    <rect x="0" y="0" width="370" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="369" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="370" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="369" y1="0" x2="369" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">Engine Loop: Deterministic [Frame = f(t)]</text>
  </g>

  <!-- Panel 2: FPS & Pipe -->
  <g transform="translate(378, 3)">
    <rect x="0" y="0" width="250" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="249" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="250" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="249" y1="0" x2="249" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">Pipeline: 60 FPS (ProRes 4444 4K)</text>
  </g>

  <!-- Panel 3: Shaders -->
  <g transform="translate(632, 3)">
    <rect x="0" y="0" width="196" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="195" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="196" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="195" y1="0" x2="195" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">GLSL PBR: Active (HalfFloat)</text>
  </g>

  <!-- Gripper -->
  <g transform="translate(834, 7)">
    <line x1="10" y1="10" x2="12" y2="8" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="11" y1="11" x2="13" y2="9" stroke="#808080" stroke-width="1.2"/>
    <line x1="6" y1="10" x2="12" y2="4" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="7" y1="11" x2="13" y2="5" stroke="#808080" stroke-width="1.2"/>
    <line x1="2" y1="10" x2="12" y2="0" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="3" y1="11" x2="13" y2="1" stroke="#808080" stroke-width="1.2"/>
  </g>
</svg>
