<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 50" width="100%" height="50">
  <defs>
    <linearGradient id="win98Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#1084d0"/>
    </linearGradient>
    <style>
      .win-font { font-family: 'Segoe UI', Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif; }
    </style>
  </defs>

  <!-- Outer Window Top Bevel -->
  <rect x="0" y="0" width="850" height="50" fill="#c0c0c0"/>
  <line x1="0" y1="0" x2="850" y2="0" stroke="#ffffff" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="50" stroke="#ffffff" stroke-width="2"/>
  <line x1="849" y1="0" x2="849" y2="50" stroke="#808080" stroke-width="2"/>

  <!-- Title Bar -->
  <rect x="3" y="3" width="844" height="22" fill="url(#win98Grad)"/>
  
  <!-- Notepad Icon -->
  <g transform="translate(8, 6)">
    <!-- Notepad paper -->
    <rect x="0" y="0" width="12" height="15" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <!-- Spiral top or blue top band -->
    <rect x="0" y="0" width="12" height="3" fill="#000080"/>
    <!-- Pencil -->
    <path d="M 10 3 L 14 7 L 7 14 L 3 14 Z" fill="#ffcc00" stroke="#000000" stroke-width="0.6"/>
    <path d="M 3 14 L 5 14 L 3 12 Z" fill="#000000"/>
  </g>

  <!-- Title Text -->
  <text x="28" y="18" fill="#ffffff" font-size="12" font-weight="bold" class="win-font" letter-spacing="0.5">README.TXT - Notepad</text>

  <!-- Window Control Buttons (Min, Max, Close) -->
  <g transform="translate(780, 6)">
    <!-- Min -->
    <rect x="0" y="0" width="16" height="15" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/>
    <line x1="1" y1="1" x2="14" y2="1" stroke="#ffffff" stroke-width="1"/>
    <line x1="1" y1="1" x2="1" y2="13" stroke="#ffffff" stroke-width="1"/>
    <line x1="1" y1="14" x2="15" y2="14" stroke="#808080" stroke-width="1"/>
    <line x1="14" y1="1" x2="14" y2="14" stroke="#808080" stroke-width="1"/>
    <rect x="3" y="10" width="9" height="2" fill="#000000"/>

    <!-- Max -->
    <rect x="19" y="0" width="16" height="15" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/>
    <line x1="20" y1="1" x2="33" y2="1" stroke="#ffffff" stroke-width="1"/>
    <line x1="20" y1="1" x2="20" y2="13" stroke="#ffffff" stroke-width="1"/>
    <line x1="20" y1="14" x2="34" y2="14" stroke="#808080" stroke-width="1"/>
    <line x1="33" y1="1" x2="33" y2="14" stroke="#808080" stroke-width="1"/>
    <rect x="22" y="3" width="10" height="9" fill="none" stroke="#000000" stroke-width="1.5"/>
    <rect x="22" y="3" width="10" height="2" fill="#000000"/>

    <!-- Close -->
    <rect x="38" y="0" width="16" height="15" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/>
    <line x1="39" y1="1" x2="52" y2="1" stroke="#ffffff" stroke-width="1"/>
    <line x1="39" y1="1" x2="39" y2="13" stroke="#ffffff" stroke-width="1"/>
    <line x1="39" y1="14" x2="53" y2="14" stroke="#808080" stroke-width="1"/>
    <line x1="52" y1="1" x2="52" y2="14" stroke="#808080" stroke-width="1"/>
    <path d="M 42 3 L 50 11 M 50 3 L 42 11" stroke="#000000" stroke-width="1.8"/>
  </g>

  <!-- Notepad Menu Bar -->
  <g transform="translate(10, 39)">
    <text x="0" y="0" fill="#000000" font-size="11" class="win-font"><tspan text-decoration="underline">F</tspan>ile</text>
    <text x="35" y="0" fill="#000000" font-size="11" class="win-font"><tspan text-decoration="underline">E</tspan>dit</text>
    <text x="70" y="0" fill="#000000" font-size="11" class="win-font"><tspan text-decoration="underline">S</tspan>earch</text>
    <text x="120" y="0" fill="#000000" font-size="11" class="win-font"><tspan text-decoration="underline">H</tspan>elp</text>
  </g>

  <!-- Sunken bottom separator for the text editor body -->
  <line x1="2" y1="48" x2="848" y2="48" stroke="#808080" stroke-width="1"/>
  <line x1="2" y1="49" x2="848" y2="49" stroke="#ffffff" stroke-width="1"/>
</svg>
