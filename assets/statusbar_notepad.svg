<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 22" width="100%" height="22">
  <defs>
    <style>
      .win-font { font-family: 'Segoe UI', Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif; font-size: 11px; fill: #000000; }
    </style>
  </defs>

  <!-- Background Base Gray -->
  <rect x="0" y="0" width="850" height="22" fill="#c0c0c0"/>
  <line x1="0" y1="0" x2="850" y2="0" stroke="#808080" stroke-width="1"/>
  <line x1="0" y1="1" x2="850" y2="1" stroke="#ffffff" stroke-width="1"/>

  <!-- Panel 1: Ready / Status -->
  <g transform="translate(4, 3)">
    <rect x="0" y="0" width="460" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="459" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="460" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="459" y1="0" x2="459" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">Status: Ready</text>
  </g>

  <!-- Panel 2: Line / Col -->
  <g transform="translate(468, 3)">
    <rect x="0" y="0" width="180" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="179" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="180" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="179" y1="0" x2="179" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">Ln 1, Col 1</text>
  </g>

  <!-- Panel 3: Encoding & Gripper -->
  <g transform="translate(652, 3)">
    <rect x="0" y="0" width="176" height="16" fill="#c0c0c0"/>
    <line x1="0" y1="0" x2="175" y2="0" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#808080" stroke-width="1"/>
    <line x1="0" y1="15" x2="176" y2="15" stroke="#ffffff" stroke-width="1"/>
    <line x1="175" y1="0" x2="175" y2="16" stroke="#ffffff" stroke-width="1"/>
    <text x="8" y="12" class="win-font">ANSI / Monospace UTF-8</text>
  </g>

  <!-- Win98 Window Resize Gripper (///) in bottom right -->
  <g transform="translate(834, 7)">
    <line x1="10" y1="10" x2="12" y2="8" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="11" y1="11" x2="13" y2="9" stroke="#808080" stroke-width="1.2"/>
    <line x1="6" y1="10" x2="12" y2="4" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="7" y1="11" x2="13" y2="5" stroke="#808080" stroke-width="1.2"/>
    <line x1="2" y1="10" x2="12" y2="0" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="3" y1="11" x2="13" y2="1" stroke="#808080" stroke-width="1.2"/>
  </g>
</svg>
